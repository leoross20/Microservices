spring.application.name=api-gateway
server.port=8080

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.register=true

spring.cloud.gateway.server.webmvc.routes[0].id=product-api
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://product-api
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/products/**

spring.cloud.gateway.server.webmvc.routes[1].id=currency-api
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://currency-api
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/currencies/**
spring.cloud.gateway.server.webmvc.routes[2].id=auth-api
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://auth-api
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[3].id=ws-product-api
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://product-api
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/ws/products/**

spring.cloud.gateway.server.webmvc.routes[4].id=ws-currency-api
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://currency-api
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/ws/currencies/**

spring.cloud.gateway.server.webmvc.routes[5].id=ws-auth-api
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://auth-api
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/ws/auth/**

