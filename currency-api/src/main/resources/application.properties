spring.application.name=currency-api
server.port=8100

spring.datasource.url=jdbc:postgresql://localhost:5432/db_currency
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.config.import=consul:
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

# Retry: até 3 tentativas no total
resilience4j.retry.instances.bcb-api.max-attempts=3
resilience4j.retry.instances.bcb-api.wait-duration=1s
resilience4j.retry.instances.bcb-api.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException

# Circuit Breaker
resilience4j.circuitbreaker.instances.bcb-api.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.bcb-api.sliding-window-size=5
resilience4j.circuitbreaker.instances.bcb-api.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.bcb-api.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bcb-api.wait-duration-in-open-state=100s

# Cache Caffeine
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=600s

# Ordem dos aspectos do Resilience4j
resilience4j.retry.retry-aspect-order=2
resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.io.github.resilience4j.retry=DEBUG